function thumbnail_media_type(url) {
    var fields = url.split('&');
    if (fields.indexOf('format=png') >= 0 || fields.indexOf('format=jpg') >= 0) {
	return 'img';
    } else {
	return 'video';
    }
}

function url_prefix(url) {
    return URI(url).protocol() + '://' + URI(url).hostname();
}

function url_relative(url) {
    return URI(url).relativeTo(url_prefix(url)).toString();
}

// Turn a /thumbnail URL into the matching /progress URL on the same host.
function progressUrlFor(src) {
    return src.replace(/(\/\/[^/]+)\/thumbnail\?/, '$1/progress?');
}

// Attach a progress bar to `container`, poll /progress every 500 ms until the
// media element fires load or the endpoint reports done/error. Only meaningful
// when src is served by *this* host (the one that runs progress.rb).
function attachProgressBar(container, mediaEl, src) {
    var $bar   = $('<div class="progress"><div class="fill"></div></div>');
    var $label = $('<div class="progress-label">starting…</div>');
    container.append($bar).append($label);

    var progUrl = progressUrlFor(src);

    var stopped = false;
    function stop() { stopped = true; }
    function markDone() {
        stopped = true;
        $bar.removeClass('err');
        $bar.find('.fill').css('width', '100%');
        $label.text('done');
    }
    // On a media error (e.g. /thumbnail returned 400), the server has
    // already written its specific error to .progress. Do one final poll
    // so the bar shows the real "server_error: …" instead of a generic
    // "media error". Paint the red bar synchronously; fill in the text
    // once the poll resolves.
    function markMediaError() {
        stopped = true;
        $bar.addClass('err');
        $bar.find('.fill').css('width', '100%');
        $label.text('media error');
        fetch(progUrl, {cache: 'no-store'}).then(function(r) {
            return r.ok ? r.json() : null;
        }).then(function(d) {
            if (d && (d.state === 'error' || d.state === 'server_error')) {
                $label.text(d.state.replace('_', ' ') + ': ' + String(d.message || '').slice(0, 200));
            }
        }).catch(function() {/* swallow */});
    }
    // If the media element loaded successfully, the compute clearly finished
    // — overwrite whatever stale state the last poll returned (e.g. an early
    // "unknown" that fired before the server wrote .progress).
    mediaEl.addEventListener('load',       markDone);  // <img>
    mediaEl.addEventListener('loadeddata', markDone);  // <video>
    mediaEl.addEventListener('error',      markMediaError);
    function tick() {
        if (stopped) return;
        fetch(progUrl, {cache: 'no-store'}).then(function(r) {
            return r.ok ? r.json() : null;
        }).then(function(d) {
            if (!d || stopped) return;
            var $fill = $bar.find('.fill');
            if (d.state === 'done') {
                $fill.css('width', '100%');
                $label.text('done');
                stop();
            } else if (d.state === 'error' || d.state === 'server_error') {
                $bar.addClass('err');
                $fill.css('width', '100%');
                $label.text(d.state.replace('_', ' ') + ': ' + String(d.message || '').slice(0, 200));
                stop();
            } else if (d.frames_total) {
                var pct = 100 * (d.frames_done || 0) / d.frames_total;
                $fill.css('width', pct.toFixed(1) + '%');
                $label.text((d.state || '') + ' ' + (d.frames_done || 0) + '/' + d.frames_total);
            } else if (d.state === 'unknown' || !d.state) {
                // /progress correctly returns "unknown" before the worker has
                // written a .progress file. From this page we know the
                // /thumbnail request is in flight, so relabel.
                $label.text('Not yet started');
            } else {
                $label.text(d.state);
            }
        }).catch(function() {/* swallow polling errors */}).then(function() {
            setTimeout(tick, 1000);
        });
    }
    setTimeout(tick, 0);
}

function init() {
    console.log('init');
    for (var i = 0; i < tests.length; i++) {
	var test = tests[i];
	var title = test.title;
	var node;
	var media_type = thumbnail_media_type(test.src);

	$("body").append(`<h2>${i} ${title} (${media_type})</h2>`);
	var prefixes = [url_prefix(test.src), url_prefix(document.location)];
	for (var j = 0; j < prefixes.length; j++) {
	    var src = prefixes[j] + "/" + url_relative(test.src);
	    if (j == 1) {
		src += `&testepoch=${new Date().getTime()}`;
	    }
	    var host = URI(prefixes[j]).host();
	    var $container = $(`<div class="test">` +
				`  <${media_type} src="${src}" autoplay loop muted style="max-width:250px"></${media_type}>` +
				`<br>${host}</div>`);
	    $('body').append($container);
	    // Only attach a progress bar to thumbnails served by *this* host;
	    // /progress isn't routed on other hosts.
	    if (URI(prefixes[j]).host() === URI(document.location).host()) {
		var mediaEl = $container.find(media_type)[0];
		attachProgressBar($container, mediaEl, src);
	    }
	}
    }
}

$(init);
